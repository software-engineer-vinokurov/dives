ingress:
  clusterIssuer: "letsencrypt-prod"

env:
  # No custom Authentik brand -- pumpking's shared default host, application
  # slug == the project name.
  AUTHENTIK_ISSUER: "https://auth.aleksandr.vin/application/o/dives/"
  HEALTHCHECK_PING_URL: "https://healthchecks.aleksandr.vin/ping/REPLACE_WITH_REAL_TOKEN"
  # Sender identity for dive backup / signup notification emails.
  email_host_user: "zulu@aleksandr.vin"
  DIVES_ADMIN_EMAIL: "admin@aleksandr.vin"
  DIVES_ADMIN_NAME: "Mr. Admin"
  OTEL_DEPLOYMENT_ENVIRONMENT: "dev"
  # In-app feedback button -> Gitea issue labelled `user-feedback` (issue #22).
  # The public hostname sits behind a Traefik ip-allowlist Middleware in the gitea namespace
  # (only one external IP is allowed) -- any in-cluster pod's own egress gets a bare 403
  # "Forbidden" from that middleware, never reaching Gitea. Use the in-cluster ClusterIP
  # Service instead (gitea/gitea in the gitea namespace), which bypasses the public ingress
  # and its IP allowlist entirely. Only relevant for pumpking-hosted deployments; anywhere
  # else, override this back to the public https:// hostname.
  GITEA_BASE_URL: "http://gitea.gitea.svc.cluster.local:3000"
  GITEA_OWNER: "software-engineer-vinokurov"
  GITEA_REPO: "dives"

appSecrets:
  email_host_password: "replace-with-email-host-password"
  DIVES_ADMIN_PASSWORD: "replace-with-admin-password"
  PADI_TOKEN_ENCRYPTION_KEY: "replace-with-padi-token-encryption-key"
  PADI_USERNAME_HASH_PEPPER: "replace-with-padi-username-hash-pepper"
  SUUNTO_SESSION_ENCRYPTION_KEY: "replace-with-suunto-session-encryption-key"
  SUUNTO_EMAIL_HASH_PEPPER: "replace-with-suunto-email-hash-pepper"
  GARMIN_SESSION_ENCRYPTION_KEY: "replace-with-garmin-session-encryption-key"
  GARMIN_EMAIL_HASH_PEPPER: "replace-with-garmin-email-hash-pepper"
  GITEA_TOKEN: "replace-with-gitea-feedback-token"

notifications:
  schedule: "*/2 * * * *"

padiTokenRefresh:
  schedule: "*/30 * * * *"

suuntoSidecar:
  enabled: false
  image:
    # Defaults to the deployed app image when empty.
    repository: ""
    tag: ""
  image:
    repository: registry.pumpking.aleksandr.vin/dives/web
    tag: amnesiac


garminSidecar:
  enabled: true
  image:
    repository: registry.pumpking.aleksandr.vin/dives/web
    tag: amnesiac
