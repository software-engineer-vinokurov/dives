apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: "{{ .Release.Name }}-web"
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ .Release.Name }}-web"
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ .Release.Name }}-web"
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        rollme: {{ randAlphaNum 5 | quote }} # https://v3.helm.sh/docs/howto/charts_tips_and_tricks/#automatically-roll-deployments
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.migration.enabled .Values.backfills.enabled }}
      initContainers:
      {{- if .Values.migration.enabled }}
        - name: migration
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }} # Microk8s private registry exposed on localhost:32000.
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node"]
          args: ["scripts/db-migrate.mjs"]
          env:
          {{- range $key, $value := .Values.env }}
            - name: {{ $key | quote }}
              value: {{ $value | quote }}
          {{- end }}
          {{- range $key, $_ := .Values.appSecrets }}
            - name: {{ $key | quote }}
              valueFrom:
                secretKeyRef:
                  name: "{{ $.Release.Name }}-app-secrets"
                  key: {{ $key | quote }}
          {{- end }}
            # The one and only place that connects as the schema owner --
            # runs DDL + the app-role grant/revoke bookkeeping. Every other
            # container in this chart uses .Values.databaseApp instead.
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.secretName is required" .Values.database.secretName | quote }}
                  key: {{ .Values.database.usernameKey | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.secretName is required" .Values.database.secretName | quote }}
                  key: {{ .Values.database.passwordKey | quote }}
      {{- end }}
      {{- if .Values.backfills.enabled }}
        - name: backfills
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node"]
          args: ["scripts/run-backfills.mjs"]
          env:
          {{- range $key, $value := .Values.env }}
            - name: {{ $key | quote }}
              value: {{ $value | quote }}
          {{- end }}
          {{- range $key, $_ := .Values.appSecrets }}
            - name: {{ $key | quote }}
              valueFrom:
                secretKeyRef:
                  name: "{{ $.Release.Name }}-app-secrets"
                  key: {{ $key | quote }}
          {{- end }}
            # Data-only rewrites, never DDL -- runs as the same restricted app role as the app
            # container itself (.Values.databaseApp), not the schema-owner role the migration
            # initContainer above uses.
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ required "databaseApp.secretName is required" .Values.databaseApp.secretName | quote }}
                  key: {{ .Values.databaseApp.usernameKey | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "databaseApp.secretName is required" .Values.databaseApp.secretName | quote }}
                  key: {{ .Values.databaseApp.passwordKey | quote }}
      {{- end }}
      {{- end }}
      containers:
        - name: app
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }} # Microk8s private registry exposed on localhost:32000.
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: configs
              mountPath: /configs
              readOnly: true
          env:
            - name: NEXT_DEPLOYMENT_ID
              value: "{{ .Values.deploymentId }}"
            - name: OTEL_SERVICE_VERSION
              value: "{{ .Values.deploymentId }}"
          {{- if .Values.suuntoSidecar.enabled }}
            - name: SUUNTO_SIDECAR_URL
              value: "http://127.0.0.1:{{ .Values.suuntoSidecar.port }}"
          {{- end }}
          {{- range $key, $value := .Values.env }}
            - name: {{ $key | quote }}
              value: {{ $value | quote }}
          {{- end }}
          {{- range $key, $_ := .Values.appSecrets }}
            - name: {{ $key | quote }}
              valueFrom:
                secretKeyRef:
                  name: "{{ $.Release.Name }}-app-secrets"
                  key: {{ $key | quote }}
          {{- end }}
            # The running app connects as the restricted app role, never the
            # schema owner (that's the migration initContainer above, which
            # deliberately still points at .Values.database) -- see
            # values.yaml's databaseApp comment.
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ required "databaseApp.secretName is required" .Values.databaseApp.secretName | quote }}
                  key: {{ .Values.databaseApp.usernameKey | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "databaseApp.secretName is required" .Values.databaseApp.secretName | quote }}
                  key: {{ .Values.databaseApp.passwordKey | quote }}
            - name: AUTHENTIK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authentikSecretName | quote }}
                  key: AUTHENTIK_CLIENT_ID
            - name: AUTHENTIK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authentikSecretName | quote }}
                  key: AUTHENTIK_CLIENT_SECRET
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 0
            timeoutSeconds: 3
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 0
            timeoutSeconds: 3
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.suuntoSidecar.enabled }}
        - name: suunto-sidecar
          image: {{ default .Values.image.repository .Values.suuntoSidecar.image.repository }}:{{ default .Values.image.tag .Values.suuntoSidecar.image.tag }}
          imagePullPolicy: {{ .Values.suuntoSidecar.image.pullPolicy }}
          command: ["node"]
          args: ["scripts/suunto-sidecar/server.mjs"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: SUUNTO_SIDECAR_HOST
              value: "127.0.0.1"
            - name: SUUNTO_SIDECAR_PORT
              value: {{ .Values.suuntoSidecar.port | quote }}
            - name: SUUNTOOL_BIN
              value: {{ .Values.suuntoSidecar.suuntoolBin | quote }}
            - name: SUUNTOOL_TIMEOUT_MS
              value: {{ .Values.suuntoSidecar.timeoutMs | quote }}
            - name: SUUNTOOL_EXPORT_TIMEOUT_MS
              value: {{ .Values.suuntoSidecar.exportTimeoutMs | quote }}
            - name: SUUNTOOL_LIST_ALL_TIMEOUT_MS
              value: {{ .Values.suuntoSidecar.listAllTimeoutMs | quote }}
            - name: SUUNTO_SIDECAR_MAX_REQUEST_BYTES
              value: {{ .Values.suuntoSidecar.maxRequestBytes | quote }}
            - name: SUUNTO_SIDECAR_MAX_BUNDLE_BYTES
              value: {{ .Values.suuntoSidecar.maxBundleBytes | quote }}
            - name: SUUNTO_SIDECAR_MAX_BUNDLE_FILES
              value: {{ .Values.suuntoSidecar.maxBundleFiles | quote }}
            - name: SUUNTO_SIDECAR_MAX_LIST_ALL_WORKOUTS
              value: {{ .Values.suuntoSidecar.maxListAllWorkouts | quote }}
          ports:
            - name: suunto
              containerPort: {{ .Values.suuntoSidecar.port }}
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "fetch('http://127.0.0.1:{{ .Values.suuntoSidecar.port }}/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "fetch('http://127.0.0.1:{{ .Values.suuntoSidecar.port }}/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.suuntoSidecar.resources | nindent 12 }}
        {{- end }}
        {{- if .Values.garminSidecar.enabled }}
        - name: garmin-sidecar
          image: {{ default .Values.image.repository .Values.garminSidecar.image.repository }}:{{ default .Values.image.tag .Values.garminSidecar.image.tag }}
          imagePullPolicy: {{ .Values.garminSidecar.image.pullPolicy }}
          command: ["node"]
          args: ["scripts/garmin-sidecar/server.mjs"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: GARMIN_SIDECAR_HOST
              value: "127.0.0.1"
            - name: GARMIN_SIDECAR_PORT
              value: {{ .Values.garminSidecar.port | quote }}
          ports:
            - name: garmin
              containerPort: {{ .Values.garminSidecar.port }}
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "fetch('http://127.0.0.1:{{ .Values.garminSidecar.port }}/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "fetch('http://127.0.0.1:{{ .Values.garminSidecar.port }}/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.garminSidecar.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: configs
          configMap:
            defaultMode: 0555
            name: "{{ .Release.Name }}-configs"

{{- if .Values.appSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-app-secrets"
type: Opaque
data:
{{- range $key, $value := .Values.appSecrets }}
  {{ $key }}: {{ $value | b64enc }}
{{- end }}
{{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-web
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
  - protocol: TCP
    port: 80
    targetPort: http
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  annotations:
    # Traefik (k3s default) since the microk8s/ingress-nginx rebuild, not
    # nginx -- this project's Ingress was never converted during that
    # migration (every other app's was, see pumpking's Phase E). The
    # force-ssl-redirect equivalent is this namespace-scoped Middleware
    # the reconciler's Terraform already creates for every projects.yaml
    # entry (provisioning/terraform/middleware.tf) -- nothing to
    # provision here, just reference it.
    traefik.ingress.kubernetes.io/router.middlewares: dev-dives-redirect-https@kubernetescrd
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    # proxy-body-size/proxy-read-timeout/proxy-send-timeout and the
    # forwarded-headers annotations dropped, not translated -- Traefik
    # has no per-Ingress annotation equivalent (would need a separate
    # ServersTransport CRD) and its own defaults are already
    # unrestricted/pass-through, unlike nginx's. Same call already made
    # for the registry's Ingress during Phase E; revisit only if large
    # uploads actually hit a real limit in practice.
spec:
  tls:
  - hosts:
      - {{ .Values.ingress.host }}
    secretName: {{ .Values.ingress.tls.secretName }} # cert-manager will store the created certificate in this secret
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-service
            port:
              number: 80
