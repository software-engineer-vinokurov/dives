replicaCount: 1

image:
  # k3s node containerd mirrors this hostname to the registry over
  # loopback (see pumpking/host-config/README.md).
  repository: registry.pumpking.aleksandr.vin/dives/web
  pullPolicy: Always # IfNotPresent
  tag: amnesiac

deploymentId: "xxx-unknown-xxx"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  runAsUser: 1001
  runAsGroup: 1001

service:
  type: ClusterIP
  port: 80

env:
  # postgres.data is the host-level compose Postgres, exposed in-cluster via
  # a selector-less Service (pumpking/manifests/host-services.yaml). No
  # sslmode param: that instance has no TLS configured at all, so requesting
  # TLS would fail the handshake outright rather than downgrade gracefully.
  # The path segment IS the real database name (lib/database-url.ts splices
  # DATABASE_USER/DATABASE_PASSWORD from the secret into this URL rather than
  # deriving the dbname from anywhere else) -- add-new-project's `databases`
  # param was called with name: "dives" (not "dev_dives", the idea-146
  # naming convention this originally mirrored), and the reconciler's
  # Terraform creates the Postgres database under that literal name
  # (confirmed: dives-db-credentials' `dbname` key is 5 bytes == "dives").
  DATABASE_URL: "postgres://postgres.data.svc.cluster.local:5432/dives"
  # HEALTHCHECK_PING_URL: "https://healthchecks.aleksandr.vin/ping/..."
  HEALTHCHECK_PING_INTERVAL_SECONDS: "60"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-opentelemetry-collector.default.svc.cluster.local:4317"
  OTEL_SERVICE_NAME: "dives"
  email_host: "smtp.protonmail.ch"
  email_port: "587"
  email_use_starttls: "true"
  # The address dive backup emails are sent *from*.
  email_host_user: "zulu@aleksandr.vin"
  DIVES_ADMIN_EMAIL: "admin@aleksandr.vin"
  DIVES_ADMIN_NAME: "Admin"
  NEXT_PUBLIC_BASE_URL: "https://dives.aleksandr.vin"
  # Local email/password + magic-link login stays in the codebase but is off
  # by default -- Authentik is the only sign-in path unless this is set to
  # "true" (see lib/auth-config.ts). Absent entirely = disabled, same as
  # "false".
  # PASSWORD_AUTH_ENABLED: "true"

# dives was provisioned with a single full-privilege Postgres role (no
# app_role split like idea-146's dev-idea-146.dev-idea-146_user/_app --
# add-new-project's databases param doesn't expose app_role, and adding the
# split was explicitly deferred, see PROMPTLOG.md). `database` and
# `databaseApp` therefore point at the SAME secret for now: the migration
# initContainer and the running app both connect as this one role. No
# APP_DB_ROLE grant step is needed (there's no separate low-priv role to
# grant to yet) -- revisit both together if the split is added later.
database:
  secretName: dives-db-credentials
  usernameKey: user
  passwordKey: password

databaseApp:
  secretName: dives-db-credentials
  usernameKey: user
  passwordKey: password

migration:
  enabled: true

# Runs scripts/run-backfills.mjs (every module under scripts/backfills/, e.g. issue #20's
# padi-enums.mjs) as a Deployment initContainer, right after the migration one -- every future
# deploy, not a one-shot Job. Each backfill module is required to be idempotent (see
# scripts/run-backfills.mjs's contract), so rerunning them forever is cheap once their real work is
# done, and adding a new backfill later needs no Helm change at all -- just a new file under
# scripts/backfills/.
backfills:
  enabled: true

notifications:
  schedule: "*/2 * * * *"
  batchSize: "50"
  gapMs: "1500"
  retryBaseMs: "2000"
  maxBackoffMs: "3600000"
  staleLockMs: "600000"
  maxAttempts: "8"

# Refreshes stored PADI access tokens before their ~1-hour expiry (35-minute due window in
# scripts/padi/token-refresh.mjs). PADI_TOKEN_ENCRYPTION_KEY_PREVIOUS is deliberately not a values
# key here -- it's only ever needed transiently during an active key rotation, added directly to
# the stage's real secrets file at rotation time and removed once rotation completes.
padiTokenRefresh:
  schedule: "*/30 * * * *"

garminSidecar:
  # Disabled by default so stages without garmin-sidecar dependencies still deploy.
  enabled: false
  port: 4818
  image:
    repository: ""
    pullPolicy: Always
    tag: ""


suuntoSidecar:
  # Disabled by default so stages without a suuntool-capable image still deploy.
  # When enabled, the app talks to this sidecar over 127.0.0.1 only.
  enabled: false
  port: 4817
  image:
    # Defaults to image.repository/image.tag when left empty.
    repository: ""
    pullPolicy: Always
    tag: ""
  suuntoolBin: "suuntool"
  timeoutMs: "60000"
  exportTimeoutMs: "180000"
  # "All time" listings paginate the whole history with the single-page call above, looped -- so
  # they get their own (longer) total-loop timeout and their own result-count ceiling instead of
  # borrowing the single-page ones.
  listAllTimeoutMs: "180000"
  maxRequestBytes: "1000000"
  maxBundleBytes: "25000000"
  maxBundleFiles: "20"
  maxListAllWorkouts: "20000"
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

appSecrets:
  email_host_password: "replace-with-email-host-password"
  DIVES_ADMIN_PASSWORD: "replace-with-admin-password"
  PADI_TOKEN_ENCRYPTION_KEY: "replace-with-padi-token-encryption-key"
  PADI_USERNAME_HASH_PEPPER: "replace-with-padi-username-hash-pepper"
  SUUNTO_SESSION_ENCRYPTION_KEY: "replace-with-suunto-session-encryption-key"
  SUUNTO_EMAIL_HASH_PEPPER: "replace-with-suunto-email-hash-pepper"
  GITEA_TOKEN: "replace-with-gitea-feedback-token"

resources:
  requests:
    cpu: "100m"
    memory: "500Mi"
  limits:
    cpu: "500m"
    memory: "4000Mi"

nodeSelector: {}

tolerations: []

affinity: {}

ingress:
  clusterIssuer: "letsencrypt-staging" # or "letsencrypt-prod"
  host: dives.aleksandr.vin
  tls:
    secretName: dives-aleksandr-vin-tls

# Name of the Secret pumpking's provisioning/terraform/authentik.tf
# (kubernetes_secret.authentik_client) creates and keeps in sync --
# AUTHENTIK_CLIENT_ID/AUTHENTIK_CLIENT_SECRET for whatever OAuth2 Provider
# is currently live in Authentik for this project.
authentikSecretName: "dives-authentik-secret"

persistentVolume:
  # -- Set to true to provision a PVC (see templates/pvc.yaml) for this release.
  # AGENTS NOTE: the underlying PersistentVolume must be created via the `pumpking` MCP
  # server (mcp__pumpking__add-pv), not by hand. Create the PV first, then point
  # volumeName below at it before enabling this.
  enabled: false
  # -- Size of the volume. Should be calculated based on the metrics you send and retention policy you set.
  size: 1Gi
  # -- PV name
  volumeName: pv-dives
