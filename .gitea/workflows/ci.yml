name: CI and deploy

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, and build
    runs-on: ${{ github.ref == 'refs/heads/main' && 'pumpking-main' || 'pumpking-pr' }}
    # Ships Node 24.x, WebKit, and every OS-level dependency `playwright install --with-deps`
    # would otherwise apt-get on every run -- each job here starts from a fresh ephemeral
    # container (see pumpking's runner-config-*.yaml), so that install step re-did all of that
    # from scratch every single run. The tag must stay pinned to @playwright/test's resolved
    # version (Playwright refuses to find browsers on any mismatch) -- Renovate's built-in
    # github-actions manager already tracks `container: image:` tags in workflow files the same
    # way it tracks package.json deps, so this should get bumped automatically alongside it.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 20

    services:
      # Not named "postgres" -- see idea-146's ci.yml for why a same-named
      # service container collides with pumpking's own production postgres
      # alias on the shared docker network.
      test-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dives_user
          POSTGRES_PASSWORD: dives
          POSTGRES_DB: test_dives
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://test-postgres:5432/test_dives
      DATABASE_USER: dives_user
      DATABASE_PASSWORD: dives
      TEST_DATABASE_URL: postgres://dives_user:dives@test-postgres:5432/test_dives
      PASSWORD_AUTH_ENABLED: "true"
      DIVES_ADMIN_EMAIL: admin@example.com
      DIVES_ADMIN_PASSWORD: ci-admin-password
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      PLAYWRIGHT: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**/*', 'components/**/*', 'lib/**/*', 'public/**/*', 'scripts/**/*', 'tests/**/*', '*.config.*', 'next.config.ts', 'tsconfig.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Run database-backed integration tests
        run: pnpm test:pg

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: pnpm build

  deploy:
    name: Build and deploy (dev)
    needs: checks
    # Only main pushes deploy -- checks also runs on pull_request/workflow_dispatch, which must
    # never trigger a live rollout. `needs: checks` additionally guarantees this job can never run
    # concurrently with (or start before) the checks job for the same push: the two used to be
    # separate workflow files that both triggered on `push` independently, and on this self-hosted
    # runner's shared per-repo checkout path, deploy's own `actions/checkout` was observed touching
    # files mid-run of checks' `next dev` e2e step, tripping Next's file watcher into a Fast Refresh
    # that reset in-flight client state and broke the currently-running test. Sequencing them in one
    # workflow via `needs` closes that race by construction, as well as the more obvious problem it
    # was already masking: deploy previously had no dependency on checks at all, so a broken/
    # failing build could still roll out to dev-dives.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ${{ github.ref == 'refs/heads/main' && 'pumpking-main' || 'pumpking-pr' }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        # registry-retention.sh only rotates tags matching this exact
        # <UTC timestamp>-<sha> pattern -- anything else is silently
        # excluded from pruning forever.
        run: echo "tag=$(date -u +%Y%m%d%H%M%S)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install kubectl and helm
        run: |
          curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Docker login to pumpking registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login 10.0.1.1:5000 -u registryadmin --password-stdin

      - name: Build and push image
        # Adapted from ln's pumpking/.gitea/workflows/deploy.yml reference pattern -- see
        # pumpking/changelog/2026-08-03-onboard-ln-gitea-actions.md for the host-level infra (UFW,
        # TLS SAN, registry mirror auth) this depends on, already in place and shared across every
        # project, not per-repo. dives is in the same Gitea org as ln (software-engineer-vinokurov),
        # so it reuses the org-level REGISTRY_PASSWORD/registryadmin credential directly -- no
        # per-org registry secret needed (unlike idea-146, which is a different org).
        run: |
          docker build -t 10.0.1.1:5000/dives/web:${{ steps.tag.outputs.tag }} .
          docker push 10.0.1.1:5000/dives/web:${{ steps.tag.outputs.tag }}

      - name: Deploy to dev-dives
        # dev-values.yaml carries real committed secrets (email_host_password,
        # DIVES_ADMIN_PASSWORD) so it's .gitignore'd -- the checkout genuinely
        # doesn't have it. DEV_VALUES_YAML is the whole file, base64-encoded,
        # same reasoning as KUBECONFIG_DEV below (single-line secret value,
        # no newlines to escape).
        run: |
          echo "${{ secrets.DEV_VALUES_YAML }}" | base64 -d > dev-values.yaml
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > /tmp/kubeconfig-dev-dives
          helm upgrade --install dives ./helm-charts -f dev-values.yaml \
            --set image.tag=${{ steps.tag.outputs.tag }} \
            --set deploymentId=${{ steps.tag.outputs.tag }} \
            -n dev-dives --kubeconfig /tmp/kubeconfig-dev-dives
          kubectl --kubeconfig /tmp/kubeconfig-dev-dives rollout status deployment/dives -n dev-dives --timeout=120s
